---
bluetooth_audio_user: "{{ ansible_user }}"
bluetooth_audio_user_home: "/home/{{ bluetooth_audio_user }}"
bluetooth_audio_alias: "Pi Audio"
bluetooth_audio_start_delay_seconds: 3
bluetooth_audio_analog_output: true
bluetooth_audio_manage_krnbt: true
bluetooth_audio_krnbt_off: true
bluetooth_audio_codecs:
  - sbc
  - sbc_xq
  - aptx
  - aptx_hd
  - ldac
bluetooth_audio_enable_sbc_xq: true

bluetooth_audio_packages:
  - bluez
  - pi-bluetooth
  - pipewire
  - pipewire-audio
  - pipewire-pulse
  - wireplumber
  - libspa-0.2-bluetooth
  - alsa-utils
  - pulseaudio-utils

bluetooth_audio_user_unit_dir: /usr/lib/systemd/user
